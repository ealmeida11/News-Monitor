<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Simples - Auto Reload</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { background: #f0f8ff; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .timer { font-size: 24px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Teste de Auto-Reload Simples</h1>
    <div class="status">
        <p>Esta página será recarregada automaticamente a cada 20 segundos.</p>
        <p class="timer">Próximo reload em: <span id="countdown">20</span> segundos</p>
        <p>Última atualização: <span id="lastUpdate"></span></p>
    </div>
    
    <script>
        let countdown = 20;
        let interval;
        
        function updateDisplay() {
            document.getElementById('countdown').textContent = countdown;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }
        
        function startCountdown() {
            updateDisplay();
            interval = setInterval(function() {
                countdown--;
                updateDisplay();
                
                if (countdown <= 0) {
                    clearInterval(interval);
                    console.log('Recarregando página...');
                    window.location.reload();
                }
            }, 1000);
        }
        
        // Iniciar contagem
        startCountdown();
        
        console.log('Teste de auto-reload iniciado - recarregará em 20 segundos');
    </script>
</body>
</html>
